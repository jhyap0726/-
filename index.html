"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

scene.background =

scene.fog =

/* =====================================================

const hemi =
    new THREE.HemisphereLight(

        0x536049,

    );

scene.add(hemi);


const sun =
    new THREE.DirectionalLight(

sun.position.set(

);

sun.castShadow=true;

sun.shadow.mapSize.width=4096;
sun.shadow.mapSize.height=4096;

sun.shadow.camera.left=-150;
sun.shadow.camera.right=150;
sun.shadow.camera.top=150;
sun.shadow.camera.bottom=-150;

sun.shadow.camera.near=.1;
sun.shadow.camera.far=400;

scene.add(sun);


/* =====================================================
   REALISTIC GROUND
===================================================== */

const groundGeometry =
    new THREE.PlaneGeometry(
        300,
        300,
        160,
        160
    );

groundGeometry.rotateX(
    -Math.PI/2
);

const groundPosition =
    groundGeometry.attributes.position;

for(
    let i=0;
    i<groundPosition.count;
    i++
){

    const x =
        groundPosition.getX(i);

    const z =
        groundPosition.getZ(i);

    const distance =
        Math.sqrt(
            x*x+z*z
        );

    let height =
        Math.sin(x*.025)*1.5+
        Math.cos(z*.035)*1.2+
        Math.sin((x+z)*.018)*2;

    if(distance<30){
        height*=.2;
    }

    groundPosition.setY(
        i,
        height
    );
}

groundGeometry.computeVertexNormals();


const groundMaterial =
    new THREE.MeshStandardMaterial({
        color:0x668d51,
        roughness:1,
        metalness:0
    });


const ground =
    new THREE.Mesh(
        groundGeometry,
        groundMaterial
    );

ground.receiveShadow=true;

scene.add(ground);


/* =====================================================
   REALISTIC GRASS
===================================================== */

const grassMaterial =
    new THREE.MeshStandardMaterial({
        color:0x527e3e,
        roughness:1
    });

const grassGeometry =
    new THREE.ConeGeometry(
        .035,
        .35,
        4
    );

const grass =
    new THREE.InstancedMesh(

        5000
    );

const grassDummy =
    new THREE.Object3D();

for(
    let i=0;
    i<5000;
    i++
){

    const x=
        (Math.random()-.5)*280;

    const z=
        (Math.random()-.5)*280;

    const y=
        Math.sin(x*.025)*1.5+

        x,
        y+.15,
        z
    );

    const s=

        s,
        s,
        s
    );

    grassDummy.rotation.y=
        Math.random()*Math.PI;

    grassDummy.updateMatrix();

    grass.setMatrixAt(
        i,
        grassDummy.matrix
    );
}

grass.instanceMatrix.needsUpdate=true;

scene.add(grass);


/* =====================================================
   HOUSE

function createHouse(){

    const house=
        new THREE.Group();


    const wallMaterial =
        new THREE.MeshStandardMaterial({
            color:0xd8b58b,
            roughness:.9
        });


    const wall =
        new THREE.Mesh(

        );

    wall.position.y=2.5;

    wall.castShadow=true;
    wall.receiveShadow=true;

    /* Roof */

        new THREE.Mesh(

                4

            })

        new THREE.Mesh(
            new THREE.BoxGeometry(

    /* Windows */

    for(

    ){

        const windowMesh =

                })

    house.position.set(

createHouse();


/* =====================================================
   REALISTIC ROAD
===================================================== */

const road =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            120,
            7
        ),
        new THREE.MeshStandardMaterial({
            color:0x8a765f,

        })
    );

road.rotation.x=
    -Math.PI/2;

road.position.y=.08;

road.receiveShadow=true;

scene.add(road);


/* =====================================================
   WATER
===================================================== */

const waterGeometry =
    new THREE.PlaneGeometry(
        100,
        14,
        60,
        10
    );

waterGeometry.rotateX(
    -Math.PI/2
);


const waterMaterial =
    new THREE.MeshPhysicalMaterial({
        color:0x328bb5,
        roughness:.08,
        metalness:.05,
        transmission:.05,
        transparent:true,
        opacity:.78
    });


const water =
    new THREE.Mesh(
        waterGeometry,

    );

water.position.set(
    0,
    .25,
    -45
);

scene.add(water);


/* =====================================================
   REALISTIC TREE
===================================================== */

const trees=[];

function createTree(
    x,
    z,
    scale=1
){

    const tree =
        new THREE.Group();


    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .4*scale,
                .65*scale,
                4*scale,
                16
            ),
            new THREE.MeshStandardMaterial({
                color:0x60402b,
                roughness:1
            })
        );

    trunk.position.y=
        2*scale;

    trunk.castShadow=true;

    tree.add(trunk);


    for(
        let i=0;
        i<5;
        i++
    ){

        const leaves =
            new THREE.Mesh(
                new THREE.IcosahedronGeometry(
                    2.1*scale,
                    1
                ),
                new THREE.MeshStandardMaterial({
                    color:
                        i%2
                        ?0x47763d
                        :0x588b45,
                    roughness:1
                })
            );

        leaves.position.set(
            (Math.random()-.5)*
            scale,
            (4+i*.55)*scale,
            (Math.random()-.5)*
            scale
        );

        leaves.castShadow=true;

        tree.add(leaves);
    }


    tree.position.set(
        x,
        0,
        z
    );

    scene.add(tree);

    trees.push(tree);
}


for(
    let i=0;
    i<70;
    i++
){

    let x;
    let z;

    do{

        x=
            (Math.random()-.5)*
            260;

        z=
            (Math.random()-.5)*

    }while(
        Math.abs(x)<35 &&

    );

    createTree(
        x,
        z,
        .7+
        Math.random()*.8
    );
}


/* =====================================================
   GLTF LOADER
===================================================== */

const loader =
    new GLTFLoader();


/*
    把你自己的真人 GLB 放在：

    /models/player.glb

    例如：

    你的GitHub仓库
    ├── index.html
    └── models
        └── player.glb

    下面就会自动加载。
*/


let realPlayer=null;
let mixer=null;

async function loadRealPlayer(){

    try{

        const result =
            await loader.loadAsync(
                "./models/player.glb"
            );

        realPlayer =
            result.scene;

        realPlayer.scale.set(
            1,
            1,
            1
        );

        realPlayer.position.set(
            0,
            0,
            8
        );

        realPlayer.traverse(
            object=>{

                if(object.isMesh){

                    object.castShadow=true;
                    object.receiveShadow=true;

                    if(
                        object.material
                    ){

                        object.material
                            .roughness=.7;

                    }
                }
            }
        );


        scene.add(
            realPlayer
        );


        /*
            如果 GLB 有动画，
            自动建立动画系统。
        */

        if(
            result.animations &&
            result.animations.length
        ){

            mixer=
                new THREE.AnimationMixer(
                    realPlayer
                );

            const action=
                mixer.clipAction(
                    result.animations[0]
                );

            action.play();
        }


        document.getElementById(
            "loading"
        ).style.display="none";


    }catch(error){

        console.warn(
            "没有找到 models/player.glb",
            error
        );

        /*
            没有真人模型时，
            使用备用人物。
        */

        createFallbackPlayer();

        document.getElementById(
            "loading"
        ).style.display="none";
    }
}


/* =====================================================
   备用人物
===================================================== */

const player =
    new THREE.Group();

function createFallbackPlayer(){

    const body =
        new THREE.Mesh(
            new THREE.CapsuleGeometry(
                .45,
                1,
                8,
                16
            ),

            })

            })

    player.position.set(
        0,

/* =====================================================
   玩家位置
===================================================== */

function getPlayerObject(){

    return realPlayer || player;
}


/* =====================================================
   INPUT
===================================================== */

const keys={};

window.addEventListener(
    "keydown",
    event=>{

        const key=
            event.key.toLowerCase();

        keys[key]=true;

        if(key==="e"){
            interact();
        }
    }
);


window.addEventListener(
    "keyup",
    event=>{

        keys[
            event.key.toLowerCase()
        ]=false;

    }
);


/* 手机 */

document
.querySelectorAll(".move")
.forEach(
    button=>{

        const key=
            button.dataset.key;

        button.addEventListener(
            "touchstart",
            e=>{
                e.preventDefault();
                keys[key]=true;
            }
        );

        button.addEventListener(
            "touchend",
            e=>{
                e.preventDefault();
                keys[key]=false;
            }
        );
    }
);


/* =====================================================
   CAMERA CONTROL
===================================================== */

let angle=.7;
let pitch=.35;

let dragging=false;

let lastX=0;
let lastY=0;

canvas.addEventListener(
    "pointerdown",
    e=>{

        dragging=true;

        lastX=e.clientX;
        lastY=e.clientY;
    }
);

window.addEventListener(
    "pointerup",
    ()=>{
        dragging=false;
    }
);

window.addEventListener(
    "pointermove",
    e=>{

        if(!dragging)
            return;

        angle-=
            (e.clientX-lastX)*.006;

        pitch+=
            (e.clientY-lastY)*.004;

        pitch=
            THREE.MathUtils.clamp(
                pitch,
                .15,
                .8
            );

        lastX=e.clientX;
        lastY=e.clientY;
    }
);


/* =====================================================
   PLAYER MOVEMENT
===================================================== */

function updatePlayer(dt){

    const p=
        getPlayerObject();

    let x=0;
    let z=0;

    if(keys.w)z-=1;
    if(keys.s)z+=1;
    if(keys.a)x-=1;
    if(keys.d)x+=1;

    if(
        x===0 &&
        z===0
    )
        return;


    const length=
        Math.sqrt(
            x*x+z*z
        );

    x/=length;
    z/=length;


    const speed=
        7*dt;


    p.position.x+=
        x*speed;

    p.position.z+=
        z*speed;


    p.position.x=
        THREE.MathUtils.clamp(
            p.position.x,
            -135,
            135
        );

    p.position.z=
        THREE.MathUtils.clamp(
            p.position.z,
            -135,
            135
        );


    p.rotation.y=
        Math.atan2(
            x,
            z
        );
}


/* =====================================================
   CAMERA FOLLOW
===================================================== */

function updateCamera(){

    const p=
        getPlayerObject();

    const distance=8;

    const horizontal=
        Math.cos(pitch)*
        distance;

    const x=
        p.position.x-
        Math.sin(angle)*
        horizontal;

    const z=
        p.position.z-
        Math.cos(angle)*
        horizontal;

    const y=
        p.position.y+
        2+
        Math.sin(pitch)*
        distance;


    camera.position.lerp(
        new THREE.Vector3(
            x,
            y,
            z
        ),
        .12
    );


    camera.lookAt(
        p.position.x,
        p.position.y+1.2,
        p.position.z
    );
}


/* =====================================================
   WEATHER
===================================================== */

const rainCount=1800;

const rainPositions=
    new Float32Array(
        rainCount*3
    );

for(
    let i=0;
    i<rainCount;
    i++
){

    rainPositions[i*3]=
        (Math.random()-.5)*
        180;

    rainPositions[i*3+1]=
        Math.random()*80;

    rainPositions[i*3+2]=
        (Math.random()-.5)*
        180;
}


const rainGeometry=
    new THREE.BufferGeometry();

rainGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        rainPositions,
        3
    )
);


const rainMaterial=
    new THREE.PointsMaterial({
        color:0xb5d8ef,
        size:.08,
        transparent:true,
        opacity:.55
    });


const rain=
    new THREE.Points(
        rainGeometry,
        rainMaterial
    );

rain.visible=false;

scene.add(rain);

let weather="晴天";


function updateRain(dt){

    const positions=
        rainGeometry
        .attributes
        .position
        .array;

    for(
        let i=0;
        i<rainCount;
        i++
    ){

        positions[i*3+1]-=
            dt*35;

        if(
            positions[i*3+1]<0
        ){

            positions[i*3+1]=80;
        }
    }

    rainGeometry
        .attributes
        .position
        .needsUpdate=true;
}


/* =====================================================
   DAY NIGHT
===================================================== */

let gameTime=8;


function updateTime(dt){

    gameTime+=dt*.06;

    if(gameTime>=24)
        gameTime-=24;


    const sunAngle=
        gameTime/
        24*
        Math.PI*2;


    const sunHeight=
        Math.sin(
            sunAngle-
            Math.PI/2
        );


    sun.position.set(
        Math.cos(sunAngle)*100,
        Math.max(
            8,
            sunHeight*120
        ),
        60
    );


    const daylight=
        Math.max(
            0,
            sunHeight
        );


    sun.intensity=
        .35+
        daylight*2.8;


    hemi.intensity=
        .45+
        daylight*1.1;


    const sky=
        new THREE.Color();


    if(
        gameTime>=6 &&
        gameTime<8
    ){

        sky.lerpColors(
            new THREE.Color(
                0x18243b
            ),
            new THREE.Color(
                0xe9a06c
            ),
            (gameTime-6)/2
        );

    }
    else if(
        gameTime>=8 &&
        gameTime<18
    ){

        sky.set(
            0x9bc7df
        );

    }
    else if(
        gameTime>=18 &&
        gameTime<20
    ){

        sky.lerpColors(
            new THREE.Color(
                0x9bc7df
            ),
            new THREE.Color(
                0xe08b66
            ),
            (gameTime-18)/2
        );

    }
    else{

        sky.set(
            0x17243c
        );
    }


    scene.background.copy(
        sky
    );

    scene.fog.color.copy(
        sky
    );


    const hours=
        Math.floor(gameTime);

    const minutes=
        Math.floor(
            (gameTime-hours)*60
        );


    document.getElementById(
        "time"
    ).textContent=
        String(hours).padStart(2,"0")
        +":"+
        String(minutes).padStart(2,"0");
}


/* =====================================================
   WATER ANIMATION
===================================================== */

function updateWater(time){

    const pos=
        waterGeometry
        .attributes
        .position;

    for(
        let i=0;
        i<pos.count;
        i++
    ){

        const x=
            pos.getX(i);

        const wave=
            Math.sin(
                x*.25+
                time*.0015
            )*.08;

        pos.setY(
            i,
            wave
        );
    }

    pos.needsUpdate=true;
}


/* =====================================================
   INTERACTION
===================================================== */

window.interact=function(){

    const p=
        getPlayerObject();

    const x=
        p.position.x;

    const z=
        p.position.z;


    /* 森林 */

    if(
        Math.abs(x)>30
    ){

        wood+=2;

        showMessage(
            "🪵 砍伐获得木材 +2"
        );

        updateUI();

        return;
    }


    /* 河边 */

    if(
        Math.abs(z+45)<8
    ){

        gold+=
            Math.floor(
                Math.random()*20
            )+5;

        showMessage(
            "🎣 钓鱼获得金币"
        );

        updateUI();

        return;
    }


    /* 房屋 */

    if(
        Math.abs(x+10)<8 &&
        Math.abs(z+10)<8
    ){

        showMessage(
            "🏠 你回到了自己的家"
        );

        return;
    }


    showMessage(
        "附近没有可以互动的物体"
    );
};


/* =====================================================
   UI
===================================================== */

let gold=100;
let energy=100;
let wheat=0;
let wood=0;


function updateUI(){

    document.getElementById(
        "gold"
    ).textContent=gold;

    document.getElementById(
        "energy"
    ).textContent=
        Math.round(energy);

    document.getElementById(
        "wheat"
    ).textContent=wheat;

    document.getElementById(
        "wood"
    ).textContent=wood;

    document.getElementById(
        "weather"
    ).textContent=weather;
}


/* =====================================================
   MESSAGE
===================================================== */

let messageTimeout;

function showMessage(text){

    const box=
        document.getElementById(
            "message"
        );

    box.textContent=text;

    box.style.display="block";

    clearTimeout(
        messageTimeout
    );

    messageTimeout=
        setTimeout(
            ()=>{
                box.style.display="none";
            },
            1800
        );
}


/* =====================================================
   SAVE
===================================================== */

window.saveGame=function(){

    const p=
        getPlayerObject();

    localStorage.setItem(
        "realisticVillageSave",
        JSON.stringify({

            gold,
            energy,
            wheat,
            wood,

            x:p.position.x,
            z:p.position.z,

            gameTime,
            weather
        })
    );

    showMessage(
        "💾 游戏已经保存"
    );
};


function loadGame(){

    const data=
        localStorage.getItem(
            "realisticVillageSave"
        );

    if(!data)
        return;

    try{

        const save=
            JSON.parse(data);

        gold=
            save.gold??100;

        energy=
            save.energy??100;

        wheat=
            save.wheat??0;

        wood=
            save.wood??0;

        gameTime=
            save.gameTime??8;

        weather=
            save.weather??"晴天";


    }catch(e){

        console.warn(
            "存档读取失败"
        );
    }
}


window.resetGame=function(){

    localStorage.removeItem(
        "realisticVillageSave"
    );

    location.reload();
};

   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            window.innerWidth/
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =====================================================
   GAME LOOP
===================================================== */

const clock=
    new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );


    const dt=
        Math.min(
            clock.getDelta(),
            .05
        );


    const time=
        performance.now();


    updatePlayer(dt);

    updateCamera();

    updateTime(dt);

    updateRain(dt);

    updateWater(time);


    if(mixer){

        mixer.update(dt);

    }


    renderer.render(
        scene,
        camera
    );
}


/* =====================================================
   START
===================================================== */

loadGame();

updateUI();

loadRealPlayer();

animate();
