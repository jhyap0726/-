<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

/* =========================================================
   基础
========================================================= */

const canvas = document.getElementById("game");

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x9bc6df);

scene.fog = new THREE.Fog(
    0x9bc6df,
    45,
    180
);

const camera = new THREE.PerspectiveCamera(
    65,
    innerWidth / innerHeight,
    0.1,
    500
);

camera.position.set(0,6,10);

const renderer = new THREE.WebGLRenderer({
    canvas,
    antialias:true
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

renderer.outputColorSpace = THREE.SRGBColorSpace;

/* =========================================================
   光照
========================================================= */

const ambient = new THREE.HemisphereLight(
    0xbfe8ff,
    0x526044,
    1.3
);

scene.add(ambient);

const sun = new THREE.DirectionalLight(
    0xfff0d0,
    2.2
);

sun.position.set(
    -40,
    70,
    35
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -80;
sun.shadow.camera.right = 80;
sun.shadow.camera.top = 80;
sun.shadow.camera.bottom = -80;

scene.add(sun);

/* =========================================================
   地形
========================================================= */

const terrainGeo = new THREE.PlaneGeometry(
    180,
    180,
    90,
    90
);

terrainGeo.rotateX(-Math.PI/2);

const positions = terrainGeo.attributes.position;

for(let i=0;i<positions.count;i++){

    const x = positions.getX(i);
    const z = positions.getZ(i);

    let y =
        Math.sin(x*0.07)*0.65 +
        Math.cos(z*0.06)*0.55 +
        Math.sin((x+z)*0.035)*1.2;

    // 中央村庄保持较平
    const dist = Math.sqrt(x*x+z*z);

    if(dist < 25){
        y *= 0.25;
    }

    positions.setY(i,y);
}

terrainGeo.computeVertexNormals();

const terrainMat = new THREE.MeshStandardMaterial({
    color:0x5f8e4c,
    roughness:0.95,
    metalness:0
});

const terrain = new THREE.Mesh(
    terrainGeo,
    terrainMat
);

terrain.receiveShadow = true;

scene.add(terrain);

/* =========================================================
   辅助函数
========================================================= */

function box(
    w,h,d,
    color,
    x,y,z
){

    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w,h,d),
        new THREE.MeshStandardMaterial({
            color,
            roughness:.85
        })
    );

    mesh.position.set(x,y,z);

    mesh.castShadow=true;
    mesh.receiveShadow=true;

    scene.add(mesh);

    return mesh;
}

function cyl(
    radius,
    height,
    color,
    x,y,z
){

    const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(
            radius,
            radius,
            height,
            12
        ),
        new THREE.MeshStandardMaterial({
            color,
            roughness:.9
        })
    );

    mesh.position.set(x,y,z);

    mesh.castShadow=true;
    mesh.receiveShadow=true;

    scene.add(mesh);

    return mesh;
}

/* =========================================================
   房子
========================================================= */

function createHouse(x,z){

    const group = new THREE.Group();

    const wall = new THREE.Mesh(
        new THREE.BoxGeometry(9,4.5,7),
        new THREE.MeshStandardMaterial({
            color:0xd8b58c,
            roughness:.9
        })
    );

    wall.position.y=2.25;
    wall.castShadow=true;
    wall.receiveShadow=true;

    group.add(wall);

    /* 屋顶 */

    const roof = new THREE.Mesh(
        new THREE.ConeGeometry(
            6.3,
            3.5,
            4
        ),
        new THREE.MeshStandardMaterial({
            color:0x70442d,
            roughness:.85
        })
    );

    roof.rotation.y=Math.PI/4;
    roof.position.y=6.1;

    roof.castShadow=true;

    group.add(roof);

    /* 门 */

    const door = new THREE.Mesh(
        new THREE.BoxGeometry(
            1.5,
            2.6,
            .15
        ),
        new THREE.MeshStandardMaterial({
            color:0x513323
        })
    );

    door.position.set(
        0,
        1.3,
        3.56
    );

    group.add(door);

    /* 窗户 */

    for(const side of [-1,1]){

        const window = new THREE.Mesh(
            new THREE.BoxGeometry(
                1.8,
                1.3,
                .12
            ),
            new THREE.MeshStandardMaterial({
                color:0x9bd5e8,
                roughness:.2,
                metalness:.1
            })
        );

        window.position.set(
            side*3,
            2.7,
            3.58
        );

        group.add(window);
    }

    /* 烟囱 */

    const chimney = new THREE.Mesh(
        new THREE.BoxGeometry(
            .8,
            2.3,
            .8
        ),
        new THREE.MeshStandardMaterial({
            color:0x69483a
        })
    );

    chimney.position.set(
        2.2,
        6.3,
        -1
    );

    group.add(chimney);

    group.position.set(x,0,z);

    scene.add(group);
}

createHouse(-12,-10);

/* =========================================================
   谷仓
========================================================= */

function createBarn(){

    const g=new THREE.Group();

    const body=new THREE.Mesh(
        new THREE.BoxGeometry(10,5,8),
        new THREE.MeshStandardMaterial({
            color:0xa8422f
        })
    );

    body.position.y=2.5;

    body.castShadow=true;

    g.add(body);

    const roof=new THREE.Mesh(
        new THREE.ConeGeometry(
            7,
            4,
            4
        ),
        new THREE.MeshStandardMaterial({
            color:0x4b3328
        })
    );

    roof.rotation.y=Math.PI/4;
    roof.position.y=7;

    roof.castShadow=true;

    g.add(roof);

    g.position.set(15,-4);

    scene.add(g);
}

createBarn();

/* =========================================================
   农田
========================================================= */

const farm = new THREE.Group();

const soilMat = new THREE.MeshStandardMaterial({
    color:0x65452d,
    roughness:1
});

for(let row=0;row<5;row++){

    for(let col=0;col<8;col++){

        const soil=new THREE.Mesh(
            new THREE.BoxGeometry(
                1.4,
                .12,
                1.5
            ),
            soilMat
        );

        soil.position.set(
            -2+col*1.55,
            .08,
            -1+row*1.7
        );

        soil.receiveShadow=true;

        farm.add(soil);
    }
}

farm.position.set(-25,0,15);

scene.add(farm);

/* =========================================================
   作物
========================================================= */

const crops=[];

function createCrop(x,z,type="wheat"){

    const g=new THREE.Group();

    const color =
        type==="corn"
        ? 0xd8c936
        : 0x7eb34d;

    for(let i=0;i<5;i++){

        const stem=new THREE.Mesh(
            new THREE.CylinderGeometry(
                .035,
                .05,
                .7,
                6
            ),
            new THREE.MeshStandardMaterial({
                color
            })
        );

        stem.position.set(
            (Math.random()-.5)*.25,
            .38,
            (Math.random()-.5)*.25
        );

        stem.rotation.z=
            (Math.random()-.5)*.25;

        g.add(stem);
    }

    g.position.set(x,.1,z);

    scene.add(g);

    crops.push({
        object:g,
        type,
        mature:true
    });
}

/* 预生成农作物 */

for(let i=0;i<12;i++){

    createCrop(
        -24+(i%4)*1.55,
        14+Math.floor(i/4)*1.7,
        i%2 ? "wheat":"corn"
    );
}

/* =========================================================
   树
========================================================= */

const trees=[];

function createTree(x,z,scale=1){

    const g=new THREE.Group();

    const trunk=new THREE.Mesh(
        new THREE.CylinderGeometry(
            .45*scale,
            .65*scale,
            3*scale,
            10
        ),
        new THREE.MeshStandardMaterial({
            color:0x65402a,
            roughness:1
        })
    );

    trunk.position.y=1.5*scale;

    trunk.castShadow=true;

    g.add(trunk);

    for(let i=0;i<3;i++){

        const crown=new THREE.Mesh(
            new THREE.SphereGeometry(
                1.7*scale,
                12,
                10
            ),
            new THREE.MeshStandardMaterial({
                color:
                    i===0
                    ? 0x477b3f
                    : 0x5d9147,
                roughness:1
            })
        );

        crown.position.set(
            (Math.random()-.5)*.8*scale,
            (3+i*.7)*scale,
            (Math.random()-.5)*.8*scale
        );

        crown.castShadow=true;

        g.add(crown);
    }

    g.position.set(x,0,z);

    scene.add(g);

    trees.push(g);
}

/* 森林 */

for(let i=0;i<45;i++){

    let x;
    let z;

    do{
        x=(Math.random()-.5)*150;
        z=(Math.random()-.5)*150;
    }while(
        Math.abs(x)<30 &&
        Math.abs(z)<30
    );

    createTree(
        x,
        z,
        .8+Math.random()*.6
    );
}

========================================================= */

const waterGeo=new THREE.PlaneGeometry(
    75,
    9,
    50,
    4
);

waterGeo.rotateX(-Math.PI/2);

const waterMat=new THREE.MeshStandardMaterial({

const water=new THREE.Mesh(

water.position.set(0,.15,-27);

water.rotation.y=0.08;

water.receiveShadow=true;

scene.add(water);

/* =========================================================
   河岸石头
========================================================= */

for(let i=0;i<30;i++){

    const rock=new THREE.Mesh(
        new THREE.DodecahedronGeometry(
            .25+Math.random()*.5
        ),
        new THREE.MeshStandardMaterial({
            color:0x77766d,

        })
    );

    rock.position.set(

    );

    rock.castShadow=true;

    scene.add(rock);
}

/* =========================================================
   动物
========================================================= */

const animals=[];

function createCow(x,z){

    const g=new THREE.Group();

    const body=new THREE.Mesh(
        new THREE.BoxGeometry(
            2.2,
            1.2,
            1.1
        ),
        new THREE.MeshStandardMaterial({
            color:0xf0ede4
        })
    );

    body.position.y=1.25;
    body.castShadow=true;

    g.add(body);

    const head=new THREE.Mesh(
        new THREE.BoxGeometry(
            .85,
            .9,
            .8
        ),
        new THREE.MeshStandardMaterial({
            color:0xe9e2d4
        })
    );

    head.position.set(
        1.25,
        1.5,
        0
    );

    head.castShadow=true;

    g.add(head);

    /* 黑色斑点 */

    for(let i=0;i<4;i++){

        const spot=new THREE.Mesh(
            new THREE.SphereGeometry(
                .22,
                8,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:0x3d3934
            })
        );

        spot.position.set(
            (Math.random()-.5)*1.5,
            1.25,
            (Math.random()-.5)*.58
        );

        g.add(spot);
    }

    /* 腿 */

    for(let i=0;i<4;i++){

        const leg=new THREE.Mesh(
            new THREE.CylinderGeometry(
                .12,
                .14,
                1
            ),
            new THREE.MeshStandardMaterial({
                color:0x4a3b30
            })
        );

        leg.position.set(
            i<2 ? .65:-.65,
            .5,
            i%2 ? -.35:.35
        );

        leg.castShadow=true;

        g.add(leg);
    }

    g.position.set(x,0,z);

    scene.add(g);

    animals.push({
        object:g,
        speed:.25+Math.random()*.3,
        phase:Math.random()*10
    });
}

function createSheep(x,z){

    const g=new THREE.Group();

    const body=new THREE.Mesh(
        new THREE.SphereGeometry(
            1.05,
            12,
            10
        ),
        new THREE.MeshStandardMaterial({
            color:0xf4f1e7,

        })
    );

    body.scale.set(1.25,.9,.8);

    body.castShadow=true;

    const head=new THREE.Mesh(
        new THREE.SphereGeometry(
            .48,

        ),
        new THREE.MeshStandardMaterial({

        })
    );

    head.position.set(
        1,
        1.3,
        0
    );

    g.add(head);

    g.position.set(x,0,z);

    scene.add(g);

    animals.push({
        object:g,
        speed:.18+Math.random()*.2,
        phase:Math.random()*10
    });
}

function createChicken(x,z){

    const g=new THREE.Group();

    const body=new THREE.Mesh(
        new THREE.SphereGeometry(
            .45,
            10,
            8
        ),
        new THREE.MeshStandardMaterial({
            color:0xf4eee0
        })
    );

    body.position.y=.55;

    g.add(body);

    const head=new THREE.Mesh(
        new THREE.SphereGeometry(
            .25,
            8,
            8
        ),
        new THREE.MeshStandardMaterial({
            color:0xf4eee0
        })
    );

    head.position.set(
        .4,
        .8,
        0
    );

    g.add(head);

    const beak=new THREE.Mesh(
        new THREE.ConeGeometry(
            .08,
            .25,
            6
        ),
        new THREE.MeshStandardMaterial({
            color:0xe09b38
        })
    );

    beak.rotation.z=-Math.PI/2;

    beak.position.set(
        .68,
        .8,
        0
    );

    g.add(beak);

    g.position.set(x,0,z);

    scene.add(g);

    animals.push({
        object:g,
        speed:.3+Math.random()*.3,
        phase:Math.random()*10
    });
}

createCow(17,5);
createCow(21,7);

createChicken(20,4);

const player=new THREE.Group();

const body=new THREE.Mesh(
    new THREE.CapsuleGeometry(

    ),

body.position.y=1.25;

player.add(body);

const head=new THREE.Mesh(

head.position.y=2.25;

head.castShadow=true;

const hair=new THREE.Mesh(
    new THREE.SphereGeometry(
        .4,
        12,
        8,

    ),

hair.position.y=2.38;

for(const side of [-1,1]){

    const arm=new THREE.Mesh(
        new THREE.CapsuleGeometry(
            .13,
            .65,

        ),

    );

    arm.rotation.z=side*.15;

    arm.castShadow=true;

    player.add(arm);

}

/* 腿 */

const legs=[];

for(const side of [-1,1]){

    const leg=new THREE.Mesh(
        new THREE.CapsuleGeometry(
            .16,
            .7,
            5,
            8
        ),
        new THREE.MeshStandardMaterial({
            color:0x303b4b
        })
    );

    leg.position.set(
        side*.23,
        .55,
        0
    );

    leg.castShadow=true;

    player.add(leg);

    legs.push(leg);
}

player.position.set(
    0,
    0,
    8
);

scene.add(player);

/* 玩家状态 */

let gold=100;
let stamina=100;
let wheat=0;
let corn=0;
let wood=0;

let hasRod=false;

let seed=5;
let cornSeed=5;

/* =========================================================
   移动
========================================================= */

const keys={};

window.addEventListener(
    "keydown",
    e=>{

        keys[e.key.toLowerCase()]=true;

        if(e.key.toLowerCase()==="e"){
            interact();
        }

        if(e.key==="Escape"){
            closeShop();
        }
    }
);

window.addEventListener(
    "keyup",
    e=>{
        keys[e.key.toLowerCase()]=false;
    }
);

/* 手机按钮 */

document.querySelectorAll(".moveBtn")
.forEach(btn=>{

    const key=btn.dataset.key;

    btn.addEventListener(
        "touchstart",
        e=>{
            e.preventDefault();
            keys[key]=true;
        }
    );

    btn.addEventListener(
        "touchend",
        e=>{
            e.preventDefault();
            keys[key]=false;
        }
    );
});

/* =========================================================
   鼠标镜头
========================================================= */

let cameraAngle=0.7;
let cameraPitch=.38;

let dragging=false;
let lastX=0;
let lastY=0;

canvas.addEventListener(
    "pointerdown",
    e=>{
        dragging=true;
        lastX=e.clientX;
        lastY=e.clientY;
    }
);

window.addEventListener(
    "pointerup",
    ()=>{
        dragging=false;
    }
);

window.addEventListener(
    "pointermove",
    e=>{

        if(!dragging)return;

        const dx=e.clientX-lastX;
        const dy=e.clientY-lastY;

        cameraAngle-=dx*.006;
        cameraPitch+=dy*.004;

        cameraPitch=
            Math.max(.18,
            Math.min(.8,cameraPitch));

        lastX=e.clientX;
        lastY=e.clientY;
    }
);

/* =========================================================
   玩家移动
========================================================= */

let walking=false;

function updatePlayer(dt){

    let x=0;
    let z=0;

    if(keys.w)x-=1;
    if(keys.s)x+=1;
    if(keys.a)z-=1;
    if(keys.d)z+=1;

    walking=(x!==0 || z!==0);

    if(!walking)return;

    const len=Math.sqrt(x*x+z*z);

    x/=len;
    z/=len;

    const speed=dt*7;

    player.position.x+=x*speed;
    player.position.z+=z*speed;

    /* 边界 */

    player.position.x=
        THREE.MathUtils.clamp(
            player.position.x,
            -82,
            82
        );

    player.position.z=
        THREE.MathUtils.clamp(
            player.position.z,
            -82,
            82
        );

    /* 朝向 */

    player.rotation.y=
        Math.atan2(x,z);

    /* 动画 */

    const walkTime=
        performance.now()*.012;

    legs[0].rotation.x=
        Math.sin(walkTime)*.55;

    legs[1].rotation.x=
        -Math.sin(walkTime)*.55;

    arms[0].rotation.x=
        -Math.sin(walkTime)*.35;

    arms[1].rotation.x=
        Math.sin(walkTime)*.35;
}

/* =========================================================
   摄像机
========================================================= */

function updateCamera(){

    const distance=9;

    const horizontal=
        Math.cos(cameraPitch)*distance;

    const targetX=
        player.position.x-
        Math.sin(cameraAngle)*horizontal;

    const targetZ=
        player.position.z-
        Math.cos(cameraAngle)*horizontal;

    const targetY=
        player.position.y+
        3+
        Math.sin(cameraPitch)*distance;

    camera.position.lerp(
        new THREE.Vector3(
            targetX,
            targetY,
            targetZ
        ),
        .12
    );

    const lookTarget=
        new THREE.Vector3(
            player.position.x,
            player.position.y+1.3,
            player.position.z
        );

    camera.lookAt(lookTarget);
}

/* =========================================================
   动物 AI
========================================================= */

function updateAnimals(time){

    animals.forEach(a=>{

        const g=a.object;

        g.position.x+=
            Math.sin(time*.0003+a.phase)*
            a.speed*.002;

        g.position.z+=
            Math.cos(time*.00027+a.phase)*
            a.speed*.002;

        g.rotation.y=
            Math.sin(time*.0003+a.phase);

        g.position.y=
            Math.abs(
                Math.sin(time*.004+a.phase)
            )*.02;
    });
}

/* =========================================================
   互动
========================================================= */

function distanceTo(x,z){

    return Math.hypot(
        player.position.x-x,
        player.position.z-z
    );
}

window.interact=function(){

    /* 农田 */

    if(
        player.position.x<-18 &&
        player.position.x>-32 &&
        player.position.z>10 &&
        player.position.z<24
    ){

        if(seed>0){

            seed--;

            createCrop(
                player.position.x,
                player.position.z,
                "wheat"
            );

            stamina=Math.max(
                0,
                stamina-3
            );

            updateUI();

            return;
        }
    }

    /* 树 */

    let nearestTree=null;
    let nearestDistance=999;

    trees.forEach(tree=>{

        const d=
            player.position.distanceTo(
                tree.position
            );

        if(d<nearestDistance){

            nearestDistance=d;
            nearestTree=tree;
        }
    });

    if(nearestTree && nearestDistance<3){

        if(stamina>=10){

            stamina-=10;
            wood+=2;

            /* 树木缩小 */

            nearestTree.scale.multiplyScalar(.86);

            if(nearestTree.scale.x<.3){

                scene.remove(nearestTree);

                const index=
                    trees.indexOf(nearestTree);

                if(index>=0)
                    trees.splice(index,1);
            }

            updateUI();

            return;
        }
    }

    /* 河边钓鱼 */

    if(
        Math.abs(
            player.position.z+27
        )<7
    ){

        if(hasRod){

            if(stamina>=8){

                stamina-=8;

                const catchFish=
                    Math.random()<.65;

                if(catchFish){

                    gold+=
                        10+
                        Math.floor(
                            Math.random()*16
                        );

                    showMessage(
                        "🎣 钓到鱼了！"
                    );

                }else{

                    showMessage(
                        "🎣 这次没有鱼……"
                    );
                }

                updateUI();

                return;
            }
        }else{

            showMessage(
                "🎣 你需要先去商店购买钓鱼工具。"
            );

            return;
        }
    }

    /* 商店附近 */

    if(
        distanceTo(0,0)<8
    ){

        openShop();
        return;
    }

    showMessage(
        "附近没有可以互动的东西。"
    );
};

/* =========================================================
   信息提示
========================================================= */

let messageTimer=null;

function showMessage(text){

    clearTimeout(messageTimer);

    let el=document.getElementById("message");

    if(!el){

        el=document.createElement("div");

        el.id="message";

        el.style.position="fixed";
        el.style.left="50%";
        el.style.top="50%";
        el.style.transform=
            "translate(-50%,-50%)";

        el.style.zIndex="100";

        el.style.background=
            "rgba(0,0,0,.72)";

        el.style.color="white";

        el.style.padding="15px 25px";

        el.style.borderRadius="14px";

        el.style.fontSize="18px";

        document.body.appendChild(el);
    }

    el.textContent=text;
    el.style.display="block";

    messageTimer=setTimeout(()=>{
        el.style.display="none";
    },1800);
}

/* =========================================================
   商店
========================================================= */

window.openShop=function(){

    document.getElementById(
        "shop"
    ).style.display="flex";
};

window.closeShop=function(){

    document.getElementById(
        "shop"
    ).style.display="none";
};

window.buyItem=function(
    type,
    amount,
    price
){

    if(gold<price){

        showMessage(
            "💰 金币不够！"
        );

        return;
    }

    gold-=price;

    if(type==="seed"){
        seed+=amount;
    }

    if(type==="cornSeed"){
        cornSeed+=amount;
    }

    if(type==="energy"){

        stamina=
            Math.min(
                100,
                stamina+amount
            );
    }

    if(type==="rod"){
        hasRod=true;
    }

    updateUI();

    showMessage(
        "购买成功！"
    );
};

   UI

function updateUI(){

    document.getElementById("gold")
        .textContent=gold;

    document.getElementById("stamina")
        .textContent=Math.round(stamina);

    document.getElementById("wheat")
        .textContent=wheat;

/* =========================================================
   昼夜系统
========================================================= */

let gameTime=8;

function updateDayNight(dt){

    gameTime+=dt*.08;

    if(gameTime>=24)
        gameTime-=24;

    const angle=
        (gameTime/24)*Math.PI*2-
        Math.PI/2;

    const sunY=
        Math.sin(angle);

    const sunX=
        Math.cos(angle);

    sun.position.set(
        sunX*60,
        Math.max(5,sunY*70),
        30
    );

    let daylight=
        Math.max(
            0,
            sunY
        );

    ambient.intensity=
        .35+
        daylight*.95;

    sun.intensity=
        .35+
        daylight*2;

    const sky=new THREE.Color();

    if(gameTime<6){

        sky.set(0x18253d);

    }else if(gameTime<8){

        sky.lerpColors(
            new THREE.Color(0x18253d),
            new THREE.Color(0xf0b47d),
            (gameTime-6)/2
        );

    }else if(gameTime<18){

        sky.set(0x9bc6df);

    }else if(gameTime<20){

        sky.lerpColors(
            new THREE.Color(0x9bc6df),
            new THREE.Color(0xe18c65),
            (gameTime-18)/2
        );

    }else{

        sky.set(0x18253d);
    }

    scene.background.copy(sky);
    scene.fog.color.copy(sky);

    const h=
        Math.floor(gameTime);

    const m=
        Math.floor(
            (gameTime-h)*60
        );

    document.getElementById(
        "timeText"
    ).textContent=
        String(h).padStart(2,"0")
        +":"+
        String(m).padStart(2,"0");
}

/* =========================================================
   天气
========================================================= */

const rainCount=1000;

const rainPositions=
    new Float32Array(
        rainCount*3
    );

for(let i=0;i<rainCount;i++){

    rainPositions[i*3]=
        (Math.random()-.5)*120;

    rainPositions[i*3+1]=
        Math.random()*60;

    rainPositions[i*3+2]=
        (Math.random()-.5)*120;
}

const rainGeo=new THREE.BufferGeometry();

rainGeo.setAttribute(
    "position",
    new THREE.BufferAttribute(
        rainPositions,
        3
    )
);

const rainMat=new THREE.PointsMaterial({
    color:0xa8c8e5,
    size:.08,
    transparent:true,
    opacity:.55
});

const rain=new THREE.Points(
    rainGeo,
    rainMat
);

rain.visible=false;

scene.add(rain);

let weather="晴天";
let weatherTimer=0;

function updateWeather(dt){

    weatherTimer+=dt;

    if(weatherTimer>45){

        weatherTimer=0;

        const r=Math.random();

        if(r<.65)
            weather="晴天";
        else if(r<.85)
            weather="阴天";
        else
            weather="下雨";
    }

    rain.visible=
        weather==="下雨";

    document.getElementById(
        "weatherText"
    ).textContent=weather;

    if(rain.visible){

        const p=
            rain.geometry.attributes.position.array;

        for(let i=0;i<rainCount;i++){

            p[i*3+1]-=dt*30;

            if(p[i*3+1]<0){

                p[i*3+1]=60;
            }
        }

        rain.geometry.attributes
            .position.needsUpdate=true;

        scene.fog.near=25;
        scene.fog.far=110;

    }else{

        scene.fog.near=45;
        scene.fog.far=180;
    }
}

/* =========================================================
   水面动画
========================================================= */

function updateWater(time){

    const pos=
        water.geometry.attributes.position;

    for(let i=0;i<pos.count;i++){

        const x=pos.getX(i);

        const y=
            Math.sin(
                x*.35+
                time*.0015
            )*.08;

        pos.setY(i,y);
    }

    pos.needsUpdate=true;
}

/* =========================================================
   自动恢复体力
========================================================= */

let staminaTimer=0;

function recoverStamina(dt){

    staminaTimer+=dt;

    if(staminaTimer>4){

        staminaTimer=0;

        stamina=
            Math.min(
                100,
                stamina+2
            );

        updateUI();
    }
}

window.saveGame=function(){

    const data={

        gold,
        stamina,
        wheat,
        corn,
        wood,
        seed,
        cornSeed,
        hasRod,

        player:{
            x:player.position.x,
            z:player.position.z
        },

        gameTime,
        weather
    };

    localStorage.setItem(
        "villageLife3DSave",
        JSON.stringify(data)
    );

    showMessage(
        "💾 游戏已保存"
    );
};

function loadGame(){

    const raw=
        localStorage.getItem(
            "villageLife3DSave"
        );

    if(!raw)return;

    try{

        const data=
            JSON.parse(raw);

        gold=data.gold??100;
        stamina=data.stamina??100;
        wheat=data.wheat??0;
        corn=data.corn??0;
        wood=data.wood??0;
        seed=data.seed??5;
        cornSeed=data.cornSeed??5;
        hasRod=data.hasRod??false;

        if(data.player){

            player.position.x=
                data.player.x??0;

            player.position.z=
                data.player.z??8;
        }

        gameTime=data.gameTime??8;
        weather=data.weather??"晴天";

        updateUI();

    }catch(e){

        console.log(
            "存档读取失败",
            e
        );
    }
}

/* =========================================================
   游戏循环
========================================================= */

const clock=new THREE.Clock();

function animate(){

    requestAnimationFrame(
        animate
    );

    const dt=
        Math.min(
            clock.getDelta(),
            .05
        );

    const time=
        performance.now();

    updatePlayer(dt);

    updateCamera();

    updateAnimals(time);

    updateDayNight(dt);

    updateWeather(dt);

    updateWater(time);

    recoverStamina(dt);

    renderer.render(
        scene,
        camera
    );
}

/* =========================================================
   启动
========================================================= */

loadGame();
updateUI();
animate();
