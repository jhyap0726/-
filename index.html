const timeUI =

const saveText =

function updateUI(){

    goldUI.textContent =
        data.gold;

    staminaUI.textContent =
        data.stamina;

    wheatUI.textContent =
        data.wheat;

    cornUI.textContent =
        data.corn;

    woodUI.textContent =
        data.wood;

    carrotUI.textContent =
        data.carrot;

    staminaFill.style.width =
        Math.max(
            0,

    const h =
        String(data.hour)
        .padStart(2,"0");

    const m =
        String(data.minute)
        .padStart(2,"0");

    timeUI.textContent =
        `☀️ 第${data.day}天 ${h}:${m}`;

}


updateUI();

    messageTimer =
        setTimeout(

/* ======================================================
   移动
====================================================== */

const keys = {

    w:false,
    a:false,
    s:false,
    d:false

};


window.addEventListener(
    "keydown",
    e => {

        const k =
            e.key.toLowerCase();

        if(k==="w")
            keys.w=true;

        if(k==="a")
            keys.a=true;

        if(k==="s")
            keys.s=true;

        if(k==="d")
            keys.d=true;

    }
);


window.addEventListener(
    "keyup",
    e => {

        const k =
            e.key.toLowerCase();

        if(k==="w")
            keys.w=false;

        if(k==="a")
            keys.a=false;

        if(k==="s")
            keys.s=false;

        if(k==="d")
            keys.d=false;

    }
);


/* 手机 */

function mobileControl(
    id,
    key
){

    const btn =
        document.getElementById(
            id
        );


    btn.addEventListener(
        "pointerdown",
        e => {

            e.preventDefault();

            keys[key]=true;

        }
    );


    btn.addEventListener(
        "pointerup",
        e => {

            e.preventDefault();

            keys[key]=false;

        }
    );


    btn.addEventListener(
        "pointercancel",
        () => {

            keys[key]=false;

        }
    );

}


mobileControl(

);

mobileControl(
    "down",
    "s"
);

mobileControl(
    "left",
    "a"
);

mobileControl(
    "right",
    "d"
);


/* ======================================================
   距离
====================================================== */

function distanceXZ(
    a,
    b
){

    const dx =
        a.x-b.x;

    const dz =
        a.z-b.z;

    return Math.sqrt(
        dx*dx+dz*dz
    );

}


/* ======================================================
   种植
====================================================== */

document.getElementById(
    "plantBtn"
).onclick =
function(){

    if(
        player.position.z < -2 ||
        player.position.z > 12 ||
        Math.abs(player.position.x)>11
    ){

        showMessage(
            "🌱 请靠近农田"
        );

        return;

    }


    const empty =
        cropPlots.find(
            p => !p.crop
        );


    if(!empty){

        showMessage(
            "农田已经种满了"
        );

        return;

    }


    if(data.wheat<=0){

        showMessage(
            "没有小麦种子！去商店购买"
        );

        return;

    }


    if(data.stamina<5){

        showMessage(
            "体力不足"
        );

        return;

    }


    data.wheat--;

    data.stamina-=5;


    empty.crop = {

        type:"wheat",

        growth:0

    };


    createCropVisual(
        empty
    );


    updateUI();

    showMessage(
        "🌱 种下了一株小麦"
    );

    saveGame();

};


/* ======================================================
   作物模型
====================================================== */

function createCropVisual(
    plot
){

    if(plot.mesh)
        farmGroup.remove(
            plot.mesh
        );


    let color =
        0x76b947;


    if(
        plot.crop &&
        plot.crop.type==="corn"
    ){

        color =
            0xffc107;

    }


    const mesh =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .18,
                .25,
                1,
                6
            ),

            new THREE.MeshStandardMaterial({

                color

            })

        );


    mesh.position.set(
        plot.x,
        .9,
        plot.z
    );


    plot.mesh =
        mesh;


    farmGroup.add(
        mesh
    );

}


/* ======================================================
   收获
====================================================== */

document.getElementById(
    "harvestBtn"
).onclick =
function(){

    if(
        player.position.z < -2 ||
        player.position.z > 12 ||
        Math.abs(player.position.x)>11
    ){

        showMessage(
            "🌾 请靠近农田"
        );

        return;

    }


    let harvested = 0;


    cropPlots.forEach(
        plot => {

            if(
                plot.crop &&
                plot.crop.growth>=100
            ){

                if(
                    plot.crop.type==="wheat"
                ){

                    data.wheat += 3;

                }

                if(
                    plot.crop.type==="corn"
                ){

                    data.corn += 3;

                }


                if(
                    plot.crop.type==="carrot"
                ){

                    data.carrot += 3;

                }


                plot.crop=null;


                if(plot.mesh){

                    farmGroup.remove(
                        plot.mesh
                    );

                    plot.mesh=null;

                }


                harvested++;

            }

        }
    );


    if(harvested){

        showMessage(
            `🌾 收获了 ${harvested} 块作物`
        );

    }else{

        showMessage(
            "还没有成熟的作物"
        );

    }


    updateUI();

    saveGame();

};


/* ======================================================
   作物成长
====================================================== */

setInterval(
    () => {

        cropPlots.forEach(
            plot => {

                if(plot.crop){

                    plot.crop.growth += 10;

                    if(
                        plot.crop.growth>100
                    )
                        plot.crop.growth=100;


                    if(plot.mesh){

                        const scale =
                            .5 +
                            plot.crop.growth /
                            100;

                        plot.mesh.scale.set(
                            scale,
                            scale,
                            scale
                        );

                    }

                }

            }
        );

    },
    5000
);


/* ======================================================
   砍树
====================================================== */

document.getElementById(
    "chopBtn"
).onclick =
function(){

    if(data.stamina<10){

        showMessage(
            "⚡ 体力不足"
        );

        return;

    }


    let nearest=null;

    let nearestDistance=4;


    trees.forEach(
        tree => {

            if(!tree.alive)
                return;


            const d =
                distanceXZ(
                    player.position,
                    tree.group.position
                );


            if(d<nearestDistance){

                nearestDistance=d;

                nearest=tree;

            }

        }
    );


    if(!nearest){

        showMessage(
            "🪓 请靠近树木"
        );

        return;

    }


    nearest.alive=false;

    nearest.group.visible=false;


    data.wood += 2;

    data.stamina -= 10;


    updateUI();

    saveGame();


    showMessage(
        "🪵 获得 2 个木材"
    );


    setTimeout(
        () => {

            nearest.alive=true;

            nearest.group.visible=true;

        },
        30000
    );

};

document.getElementById(

function(){

        ){

/* ======================================================
   昼夜
====================================================== */

function updateTimeLighting(){

    const hour =
        data.hour;


    let intensity=2;


    if(
        hour>=19 ||
        hour<6
    ){

        intensity=.35;

        scene.background =
            new THREE.Color(
                0x10182f
            );

    }else if(
        hour>=17
    ){

        intensity=.8;

        scene.background =
            new THREE.Color(
                0xf3a35c
            );

    }else{

        intensity=2;

        scene.background =
            new THREE.Color(
                0x87ceeb
            );

    }


    sun.intensity =
        intensity;

}


/* ======================================================
   相机 + 移动
====================================================== */

const clock =
    new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    const speed =
        8 * delta;


    if(keys.w)
        player.position.z -= speed;

    if(keys.s)
        player.position.z += speed;

    if(keys.a)
        player.position.x -= speed;

    if(keys.d)
        player.position.x += speed;


    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -55,
            55
        );


    player.position.z =
        THREE.MathUtils.clamp(
            player.position.z,
            -55,
            55
        );


    /* 相机跟随 */

    const target =
        new THREE.Vector3(
            player.position.x,
            0,
            player.position.z
        );


    const desired =
        new THREE.Vector3(
            player.position.x,
            10,
            player.position.z+15
        );


    camera.position.lerp(
        desired,
        .08
    );


    camera.lookAt(
        target
    );


    renderer.render(
        scene,
        camera
    );

}


animate();

   Resize
====================================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

   开始
====================================================== */

updateTimeLighting();

showMessage(

);

</script>
