function createRoad(
    x,
    z,
    width,
    length,
    rotation=0
){

    const geometry =
        new THREE.PlaneGeometry(
            width,
            length
        );

    const material =
        new THREE.MeshStandardMaterial({
            color:0x8b7657,
            roughness:1
        });

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.rotation.x =
        -Math.PI/2;

    mesh.rotation.z =
        rotation;

    mesh.position.set(
        x,
        .05,
        z
    );

    mesh.receiveShadow = true;

    world.add(mesh);

    return mesh;
}

/* =========================================================
   真实 GLB 人物
========================================================= */

async function loadRealPlayer(){

    const loader =
        new GLTFLoader();

    try{

        const timeout =
            new Promise((_,reject)=>{
                setTimeout(
                    ()=>reject(
                        new Error("model timeout")
                    ),
                    5000
                );
            });


        const modelPromise =
            loader.loadAsync(
                "./models/player.glb"
            );


        const gltf =
            await Promise.race([
                modelPromise,
                timeout
            ]);


        const model =
            gltf.scene;


        model.traverse(obj=>{

            if(obj.isMesh){

                obj.castShadow=true;
                obj.receiveShadow=true;

            }

        });


        model.scale.setScalar(.9);

        model.position.y=0;


        player.remove(
            fallbackPlayer
        );

        player.add(model);

        realPlayerLoaded=true;

        showMessage(
            "真实人物模型加载成功"
        );

    }catch(error){

        console.log(
            "没有找到 player.glb，使用内置人物。",
            error
        );

    }
}

/* =========================================================
   手机控制
========================================================= */

function mobileKey(
    element,
    key
){

    const el =
        document.getElementById(element);

    el.addEventListener(
        "touchstart",
        e=>{
            e.preventDefault();
            keys[key]=true;
        }
    );

    el.addEventListener(
        "touchend",
        e=>{
            e.preventDefault();
            keys[key]=false;
        }
    );
}

/* =========================================================

========================================================= */

let cameraYaw=0;
let cameraPitch=.38;

let dragging=false;

let lastMouseX=0;
let lastMouseY=0;


renderer.domElement.addEventListener(
    "mousedown",
    e=>{
        dragging=true;
        lastMouseX=e.clientX;
        lastMouseY=e.clientY;
    }
);

window.addEventListener(
    "mouseup",
    ()=>{
        dragging=false;
    }
);

window.addEventListener(
    "mousemove",
    e=>{

        if(!dragging)
            return;

        const dx =
            e.clientX-lastMouseX;

        const dy =
            e.clientY-lastMouseY;

        cameraYaw -= dx*.005;

        cameraPitch -= dy*.004;

        cameraPitch =
            THREE.MathUtils.clamp(
                cameraPitch,
                .15,
                1.1
            );

        lastMouseX=e.clientX;
        lastMouseY=e.clientY;
    }
);

let data={

/* =========================================================

========================================================= */

function saveGame(){

    data.x=player.position.x;
    data.z=player.position.z;

    localStorage.setItem(
        "ruralLife3D_save",
        JSON.stringify(data)
    );

    showMessage(
        "💾 游戏已保存"
    );
}


function loadGame(){

    try{

        const saved =
            localStorage.getItem(
                "ruralLife3D_save"
            );

        if(!saved)
            return;

        data =
            Object.assign(
                data,
                JSON.parse(saved)
            );

        player.position.x=data.x;
        player.position.z=data.z;

    }catch(e){

        console.log(e);

    }
}

function updateUI(){

    );

let messageTimer;

function showMessage(text){

    const el =
        document.getElementById(
            "message"
        );

    el.textContent=text;

    el.style.opacity=1;

    clearTimeout(messageTimer);

    messageTimer=setTimeout(
        ()=>{
            el.style.opacity=0;
        },
        1800
    );
}


/* =========================================================
   互动
========================================================= */

function interact(){

    if(data.stamina<5){

        showMessage(
            "体力不足"
        );

        return;
    }


    const p =
        player.position;


    let nearest=null;
    let nearestDist=999;


    for(const tree of trees){

        const d =
            p.distanceTo(
                tree.position
            );

        if(d<nearestDist){

            nearestDist=d;
            nearest=tree;
        }
    }


    if(nearest && nearestDist<6){

        chopTree();

        return;
    }


    if(
        Math.abs(p.x+85)<20 &&
        Math.abs(p.z)<12
    ){

        fishing();

        return;
    }


    if(
        p.distanceTo(
            new THREE.Vector3(
                25,
                0,
                -30
            )
        )<12
    ){

        shop();

        return;
    }


    plantCrop();
}

function plantCrop(){

    if(data.stamina<5){

        showMessage(
            "⚡ 体力不足"
        );

        return;
    }


    let nearest=null;
    let distance=999;


    for(const spot of cropSpots){

        const worldPos =
            new THREE.Vector3();

        spot.mesh.getWorldPosition(
            worldPos
        );

        const d =
            player.position.distanceTo(

        if(
            d<distance &&
